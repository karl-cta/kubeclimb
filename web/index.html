<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kubeclimb</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#content">Aller au contenu</a>

  <nav id="sidebar" aria-label="Navigation principale">
    <div class="sidebar-header">
      <svg class="logo-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 20L10 5L14 13L18 7L23 20"/>
        <line x1="3" y1="20" x2="23" y2="20"/>
      </svg>
      <span class="logo-text">kubeclimb</span>
    </div>
    <div class="sidebar-progress">
      <div class="progress-bar"><div class="progress-fill" id="global-progress"></div></div>
      <span class="progress-label" id="progress-text">0 modules</span>
    </div>
    <div class="sidebar-xp" id="sidebar-xp"></div>

    <div class="sidebar-links">
      <button class="sidebar-link" id="btn-search" type="button">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
        Rechercher
        <span class="sidebar-kbd"><kbd>&#8984;K</kbd></span>
      </button>
      <button class="sidebar-link" data-view="0" type="button">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Tableau de bord
      </button>
      <button class="sidebar-link" data-view="-1" type="button">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6a3 3 0 013 3v13a2.5 2.5 0 00-2.5-2.5H4z"/><path d="M20 4h-6a3 3 0 00-3 3v13a2.5 2.5 0 012.5-2.5H20z"/></svg>
        Aide-mémoire
      </button>
      <button class="sidebar-link" data-view="-2" type="button">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="12" height="14" rx="1.5"/><path d="M7 4h11a1.5 1.5 0 011.5 1.5V17"/></svg>
        Révision
      </button>
      <button class="sidebar-link" data-view="-3" type="button">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
        Examen blanc
      </button>
    </div>

    <div class="sidebar-nav" id="module-list"></div>
    <div class="sidebar-footer">
      <span class="cluster-status" id="cluster-status"></span>
      <div class="sidebar-footer-btns">
        <button class="btn-sm" id="btn-export" type="button">Exporter</button>
        <button class="btn-sm" id="btn-import" type="button">Importer</button>
        <button class="btn-sm btn-danger" id="btn-reset" type="button">Réinitialiser</button>
      </div>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
      <div class="sidebar-shortcuts"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> naviguer &middot; <kbd>Esc</kbd> accueil</div>
    </div>
  </nav>

  <button id="menu-toggle" aria-label="Ouvrir le menu" type="button">
    <span></span><span></span><span></span>
  </button>
  <div id="sidebar-overlay"></div>

  <div id="reading-progress"></div>

  <main id="content" tabindex="-1"></main>

  <button id="back-to-top" aria-label="Retour en haut" type="button">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M18 15l-6-6-6 6"/>
    </svg>
  </button>

  <div id="toasts" aria-live="polite"></div>

  <script src="js/modules.js"></script>
  <script src="js/cheatsheet.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
